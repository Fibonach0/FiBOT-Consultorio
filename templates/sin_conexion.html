<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión — FiBOT Consultorio</title>
  {# Página suelta a propósito: el service worker la guarda, así que no lleva sesión ni datos. #}
  <style>
    :root { --ink:#1c1b19; --muted:#5b584f; --green:#2f5233; --cream:#faf6ef; --card:#fff; --rule:#dcd6c7; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e7e3da; --muted:#aaa497; --green:#3e6a44; --cream:#151412; --card:#1e1d1a; --rule:#3a3832; } }
    body { margin:0; font-family:-apple-system, system-ui, sans-serif; background:var(--cream); color:var(--ink); }
    header { background:var(--green); color:#fff; padding:14px 20px; }
    main { max-width:520px; margin:0 auto; padding:20px; }
    .card { background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:18px; }
    button { background:var(--green); color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:.95rem; cursor:pointer; }
  </style>
</head>
<body>
  <header>FiBOT Consultorio</header>
  <main><div class="card">
    <h1 style="font-size:1.3rem;margin-top:0">Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelva, tocá el botón y seguís donde estabas.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div></main>
</body>
</html>
