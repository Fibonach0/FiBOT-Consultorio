{% extends "base.html" %}
{% block titulo %}Ingresar — FiBOT Consultorio{% endblock %}
{% block cuerpo %}
<main style="max-width:360px; margin-top:60px;">
  <div class="card">
    <h2>FiBOT Consultorio</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login_post') }}">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" autofocus required>
      <label for="clave">Clave</label>
      <input type="password" id="clave" name="clave" required>
      <div style="margin-top:16px;">
        <button class="btn" type="submit">Entrar</button>
      </div>
    </form>
  </div>
</main>
{% endblock %}
